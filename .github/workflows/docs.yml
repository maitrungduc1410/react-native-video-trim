name: Docs
on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'package.json'
      - 'yarn.lock'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - '.github/workflows/docs.yml'
      - '.github/actions/setup/**'
  pull_request:
    paths:
      - 'src/**'
      - 'docs/**'
      - 'package.json'
      - 'yarn.lock'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - '.github/workflows/docs.yml'
      - '.github/actions/setup/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # VitePress reads the git history for "last updated" dates.
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build docs
        run: yarn docs:build
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5